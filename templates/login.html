{% extends "base.html" %}
{% block title %}Login – DreamNest{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="auth-card">
        <h2>Welcome Back</h2>
        <p class="auth-sub">Log in to continue planning your dream home.</p>
        <form method="POST">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-full">Login</button>
        </form>
        <p class="auth-switch">Don't have an account? <a href="{{ url_for('signup') }}">Sign Up</a></p>
    </div>
</section>
{% endblock %}
